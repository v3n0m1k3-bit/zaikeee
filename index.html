<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>С Днём Рождения, любимая!</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Фоновый canvas, только рисует сердечки, клики не принимает -->
  <canvas id="heartsCanvas"></canvas>

  <div id="floatingMessages"></div>

  <div class="content">
    <div class="garland top-garland">
      <span class="pixel-heart"></span>
      <span class="pixel-heart"></span>
      <span class="pixel-heart"></span>
      <span class="pixel-heart"></span>
      <span class="pixel-heart"></span>
    </div>

    <h1>С Днём Рождения,<br>Зайка!</h1>
    <p class="subtitle">Моей самой нежной и прекрасной</p>
    <p class="message">
      Ты — моё самое драгоценное сокровище!<br>
      Пусть каждый день сияет ярче звёзд.
    </p>

    <div class="static-hearts">
      <span class="pixel-heart"></span>
      <span class="pixel-heart"></span>
      <span class="pixel-heart"></span>
    </div>

    <p class="love-note">Ты — моё всё 💖</p>

    <div class="garland bottom-garland">
      <span class="pixel-heart"></span>
      <span class="pixel-heart"></span>
      <span class="pixel-heart"></span>
      <span class="pixel-heart"></span>
      <span class="pixel-heart"></span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
